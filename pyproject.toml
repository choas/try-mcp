[project]
name = "mvg-mcp"
version = "0.1.0"
description = "Munich public transport MCP service for getting departures and station information"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mvg>=1.3.1",
    "mcp>=1.0.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
]
